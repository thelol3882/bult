syntax = "proto3";

package bult.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/thelol3882/bult/agent/gen/bult/agent/v1;agentv1";

// RuntimeService runs application replicas on a runner node.
// All replica IDs are issued by the control plane; the agent treats them as opaque.
service RuntimeService {
  // RunReplica pulls the image (if not cached) and starts a new replica.
  // Idempotent: a repeated call with the same replica_id and spec returns OK
  // without starting a second container; a different spec returns ALREADY_EXISTS.
  rpc RunReplica(RunReplicaRequest) returns (RunReplicaResponse);

  // StopReplica stops a running replica but keeps its container and logs.
  rpc StopReplica(StopReplicaRequest) returns (StopReplicaResponse);

  // StartReplica starts a previously stopped replica.
  // The host port is stable across restarts.
  rpc StartReplica(StartReplicaRequest) returns (StartReplicaResponse);

  // RemoveReplica deletes a replica together with its logs.
  // Idempotent: removing a replica that no longer exists returns OK.
  rpc RemoveReplica(RemoveReplicaRequest) returns (RemoveReplicaResponse);

  // ListReplicas returns every replica managed by bult on this node,
  // including ones the control plane may not know about (for reconciliation).
  rpc ListReplicas(ListReplicasRequest) returns (ListReplicasResponse);

  // Logs streams a replica's output. Without follow, the stream ends after
  // the requested tail; with follow, it stays open until the client cancels.
  rpc Logs(LogsRequest) returns (stream LogsResponse);
}

// BuildService builds and packages application images on a builder node.
// All deploy IDs are issued by the control plane; the agent treats them as opaque.
service BuildService {
  // StartDeploy validates the spec, starts the deploy job asynchronously in the background,
  // and returns immediately with state RUNNING.
  // Idempotent: calling with an existing deploy_id and matching spec returns the current
  // job; calling with an existing deploy_id but different spec returns ALREADY_EXISTS.
  rpc StartDeploy(StartDeployRequest) returns (StartDeployResponse);

  // GetDeploy returns the current state of a deploy job, restoring from disk if
  // the agent restarted.
  rpc GetDeploy(GetDeployRequest) returns (GetDeployResponse);

  // CancelDeploy stops an in-flight deploy job. Calling CancelDeploy on an already
  // finished deploy is a no-op and returns its final state with status OK.
  rpc CancelDeploy(CancelDeployRequest) returns (CancelDeployResponse);

  // WatchDeploy replays the build log from offset, follows it while the build runs,
  // and ALWAYS ends with one Deploy message in a terminal state and status OK;
  // an error status means the watch itself failed (NOT_FOUND, INVALID_ARGUMENT,
  // INTERNAL, CANCELLED).
  rpc WatchDeploy(WatchDeployRequest) returns (stream WatchDeployResponse);
}

// ReplicaState is the observed state of a replica's container.
enum ReplicaState {
  REPLICA_STATE_UNSPECIFIED = 0;
  REPLICA_STATE_RUNNING = 1;
  // The container has stopped (crashed or stopped on request); logs are kept.
  REPLICA_STATE_EXITED = 2;
}

// DeployState is the lifecycle state of a build/deploy job.
enum DeployState {
  DEPLOY_STATE_UNSPECIFIED = 0;
  DEPLOY_STATE_RUNNING = 1;
  DEPLOY_STATE_SUCCEEDED = 2;
  DEPLOY_STATE_FAILED = 3;
  DEPLOY_STATE_CANCELLED = 4;
}

message RunReplicaRequest {
  string replica_id = 1;
  // Application id not name, because name can be changed.
  string app_id = 2;
  ImageRef image = 3;
  // Port the application listens on inside the container (e.g. 8000).
  // Must be 1-65535. The agent maps it to a host port it allocates itself.
  uint32 container_port = 4;
  Limits limits = 5;
  // Environment variables, in order.
  repeated EnvVar env = 6;
}

message RunReplicaResponse {
  Replica replica = 1;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

// Limits caps the resources of a replica. Both fields are required:
// 0 is rejected with INVALID_ARGUMENT.
message Limits {
  // CPU in thousandths of a core: 500 = half a core.
  int64 cpu_millicores = 1;
  // Memory limit in bytes.
  int64 memory_bytes = 2;
}

// ImageRef points to an exact image in the registry.
message ImageRef {
  // Repository including the registry host, e.g. "192.168.252.1:5050/myapp-42".
  string repository = 1;
  // Content digest, e.g. "sha256:9f86...". Required: replicas run by digest only.
  string digest = 2;
}

// Replica is what the agent observes on the node, not what was requested.
message Replica {
  string replica_id = 1;
  string app_id = 2;
  ReplicaState state = 3;
  // Host port allocated by the agent; this is the upstream address for nginx.
  uint32 host_port = 4;
  // Image actually running; lets reconciliation tell old replicas from new.
  ImageRef image = 5;
  google.protobuf.Timestamp started_at = 6;
  // Process exit code. Set only when state is REPLICA_STATE_EXITED.
  optional int32 exit_code = 7;
}

message StopReplicaRequest {
  string replica_id = 1;
}

message StopReplicaResponse {
  Replica replica = 1;
}

message StartReplicaRequest {
  string replica_id = 1;
}

message StartReplicaResponse {
  Replica replica = 1;
}

message RemoveReplicaRequest {
  string replica_id = 1;
}

message RemoveReplicaResponse {}

message ListReplicasRequest {}

message ListReplicasResponse {
  repeated Replica replicas = 1;
}

message LogsRequest {
  string replica_id = 1;
  // Keep streaming new output until the client cancels. Has no deadline.
  bool follow = 2;
  // Number of most recent lines to send first. 0 means no history:
  // only output produced after the call (useful with follow).
  int32 tail_lines = 3;
}

message LogsResponse {
  // Raw output bytes. Not guaranteed to be valid UTF-8 (or to end on a line
  // or character boundary); decode on the consumer side.
  bytes data = 1;
}

// Source points to the Git repository and revision to be built.
message Source {
  // HTTPS repository clone URL, e.g. "https://github.com/org/repo.git".
  string repo_url = 1;
  // Branch to clone and build from.
  string branch = 2;
  string subdir = 3;
}

// Deploy represents the current execution state of a build/deploy job on the agent.
message Deploy {
  string deploy_id = 1;
  string app_id = 2;
  DeployState state = 3;
  // Git commit SHA checked out for the build.
  string commit_sha = 4;
  // Image built and pushed to the registry. Set only when state is DEPLOY_STATE_SUCCEEDED.
  // Matches the exact ImageRef structure expected by RuntimeService.RunReplica.
  ImageRef image = 5;
  // Human-readable error message explaining build failure. Set only when state is DEPLOY_STATE_FAILED.
  string error = 6;
  google.protobuf.Timestamp started_at = 7;
  // Timestamp when the deploy reached a terminal state (SUCCEEDED, FAILED, CANCELLED).
  // Unset while state is DEPLOY_STATE_RUNNING.
  google.protobuf.Timestamp finished_at = 8;
}

message StartDeployRequest {
  string deploy_id = 1;
  string app_id = 2;
  Source source = 3;
  // The Dockerfile content used to build the image.
  //
  // Precedence rule:
  // - Non-empty: Takes precedence and is used for the build, even if the
  //   repository contains its own Dockerfile (written to `.bult/Dockerfile`
  //   so the user's workspace file remains untouched).
  // - Empty: The repository's existing Dockerfile is used as the fallback.
  //
  // Note: This precedence decision is resolved entirely by the control plane;
  // the agent simply executes the instructions provided without local rules.
  string dockerfile = 4;
}

message StartDeployResponse {
  Deploy deploy = 1;
}

message GetDeployRequest {
  string deploy_id = 1;
}

message GetDeployResponse {
  Deploy deploy = 1;
}

message CancelDeployRequest {
  string deploy_id = 1;
}

message CancelDeployResponse {
  Deploy deploy = 1;
}

message WatchDeployRequest {
  string deploy_id = 1;
  // Offset in bytes into the build log. 0 starts from the beginning;
  // to resume, pass offset + len(data) from previously received chunks.
  int64 offset = 2;
}

message LogChunk {
  // Byte offset where this chunk starts in the complete build log.
  int64 offset = 1;
  // Raw output bytes produced during the build (not guaranteed to be valid UTF-8).
  bytes data = 2;
}

message WatchDeployResponse {
  oneof event {
    LogChunk log = 1;
    Deploy deploy = 2;
  }
}
