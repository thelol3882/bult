# Host-side stack.

include:
  - control-plane/compose.yaml
  - web/compose.yaml

services:
  ingress:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
    entrypoint: ["/bin/sh", "/etc/nginx/bult/entrypoint.sh"]
    command: []
    volumes:
      - ./deploy/nginx:/etc/nginx/bult:ro
      - ingress-routes:/routes
    extra_hosts:
      - "host.docker.internal:host-gateway"

  registry:
    image: registry:3
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry

volumes:
  registry-data:
  ingress-routes:
