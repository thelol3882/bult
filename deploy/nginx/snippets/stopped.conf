# Body of the server block generated for a stopped app: 503 and a static page,
# no Retry-After (the app comes back only when its owner starts it).

root /etc/nginx/bult/pages;

add_header Cache-Control "no-store" always;
error_page 503 /stopped.html;

location = /stopped.html {
    internal;
}

# The page's background; the prefix keeps it out of the way of app paths.
location = /__bult/sky.jpg {
    alias /etc/nginx/bult/pages/sky.jpg;
    add_header Cache-Control "public, max-age=86400" always;
}

location / {
    return 503;
}
