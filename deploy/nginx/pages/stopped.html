<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>App is stopped · bult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<!-- Same sky and brand grade as the dashboard's error pages; served by the ingress, so everything is inline. -->
<style>
  :root {
    --ink: #0b1622;
    --muted: #26333f;
    --font-display: "Bricolage Grotesque", "Onest", system-ui, sans-serif;
    --font-sans: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    position: relative;
    overflow: hidden;
    background: #1f8fd0 url("/__bult/sky.jpg") center bottom / cover no-repeat;
    color: var(--ink);
    font-family: var(--font-sans);
  }
  .grade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0) 82%, rgba(244, 252, 254, 0.9) 100%),
      linear-gradient(180deg, rgba(0, 175, 202, 0.74) 0%, rgba(10, 180, 206, 0.66) 30%, rgba(60, 198, 220, 0.4) 58%, rgba(120, 215, 235, 0) 80%);
  }
  .glow {
    position: absolute;
    top: -380px;
    right: -260px;
    width: 1100px;
    height: 1100px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 244, 214, 0.85) 0%, rgba(255, 232, 176, 0.38) 22%, rgba(255, 226, 170, 0.1) 40%, rgba(255, 226, 170, 0) 55%);
  }
  .brand {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 84px;
    padding: 0 clamp(16px, 7vw, 96px);
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  main {
    position: relative;
    z-index: 1;
    display: flex;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 84px 16px 0;
    text-align: center;
  }
  .code {
    display: flex;
    align-items: center;
    gap: 0.02em;
    font-family: var(--font-display);
    font-variation-settings: "opsz" 96;
    font-size: clamp(140px, 30vw, 280px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 0.9;
  }
  .cloud {
    flex: none;
    width: 0.9em;
    height: auto;
    margin: 0.04em 0.02em 0;
    filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.28));
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(-6px); }
    50% { transform: translateY(10px); }
  }
  h1 {
    margin: 32px 0 0;
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48;
    font-size: clamp(30px, 6vw, 44px);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.1;
  }
  p {
    max-width: 30rem;
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 18px;
    line-height: 1.5;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 32px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.6);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(8px);
    font-size: 15px;
    font-weight: 500;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #a3b1be;
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud { animation: none; }
  }
</style>
</head>
<body>
<div class="grade" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<div class="brand">
  <svg width="34" height="26" viewBox="0 0 34 26" aria-hidden="true">
    <circle cx="24.5" cy="8" r="6.5" fill="#fec50c"/>
    <path fill="#0b1622" d="M9 25a7.5 7.5 0 0 1-1-14.93A9.5 9.5 0 0 1 26 12.5a6.25 6.25 0 0 1 .5 12.5z"/>
  </svg>
  bult
</div>

<main>
  <div class="code" role="img" aria-label="Error 503">
    <span aria-hidden="true">5</span>
    <svg class="cloud" viewBox="20 40 285 210" overflow="visible" aria-hidden="true">
      <defs>
        <radialGradient id="cloudPuff">
          <stop offset="0" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.45" stop-color="#fff" stop-opacity="0.72"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="cloudShade" cx="0.5" cy="0.7" r="0.6">
          <stop offset="0" stop-color="#8fc4e6" stop-opacity="0.5"/>
          <stop offset="1" stop-color="#8fc4e6" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="cloudWarm" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff2cf" stop-opacity="0.85"/>
          <stop offset="1" stop-color="#fff2cf" stop-opacity="0"/>
        </radialGradient>
        <filter id="cloudErode" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018 0.026" numOctaves="3" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="30" xChannelSelector="R" yChannelSelector="G" result="eroded"/>
          <feGaussianBlur in="eroded" stdDeviation="4"/>
        </filter>
      </defs>
      <g opacity="0.92" filter="url(#cloudErode)">
        <ellipse cx="165" cy="215" rx="120" ry="38" fill="url(#cloudShade)"/>
        <circle cx="92" cy="140" r="52" fill="url(#cloudPuff)"/>
        <circle cx="138" cy="96" r="58" fill="url(#cloudPuff)"/>
        <circle cx="196" cy="84" r="56" fill="url(#cloudPuff)"/>
        <circle cx="246" cy="120" r="52" fill="url(#cloudPuff)"/>
        <circle cx="238" cy="168" r="46" fill="url(#cloudPuff)"/>
        <circle cx="178" cy="186" r="50" fill="url(#cloudPuff)"/>
        <circle cx="116" cy="182" r="44" fill="url(#cloudPuff)"/>
        <circle cx="60" cy="160" r="34" fill="url(#cloudPuff)"/>
        <circle cx="228" cy="92" r="46" fill="url(#cloudWarm)"/>
        <circle cx="250" cy="128" r="30" fill="url(#cloudWarm)"/>
      </g>
    </svg>
    <span aria-hidden="true">3</span>
  </div>
  <h1>This app is resting</h1>
  <p>Its owner has stopped it for now. It will be back as soon as it is started again.</p>
  <div class="pill"><span class="dot" aria-hidden="true"></span>Stopped</div>
</main>
</body>
</html>
