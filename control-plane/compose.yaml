# Control plane: API + PostgreSQL. Runs on its own (`docker compose up` here)
# or as part of the host stack via `include` in the root compose.yaml.

services:
  api:
    build:
      context: .
    command: >
      uvicorn app.main:create_app --factory
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://bult:bult@postgres:5432/bult
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bult
      POSTGRES_PASSWORD: bult
      POSTGRES_DB: bult
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bult -d bult"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
