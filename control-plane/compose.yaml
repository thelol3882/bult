# Control plane: API + PostgreSQL. Runs on its own (`docker compose up` here)
# or as part of the host stack via `include` in the root compose.yaml.

services:
  api:
    build:
      context: .
    command: >
      sh -c "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://bult:bult@postgres:5432/bult
      WATCHFILES_FORCE_POLLING: "true"
      BULT_BUILDER: "192.168.252.8:50051"
      BULT_RUNNERS: "bult-node-1=192.168.252.6:50051"
      BULT_TRUSTED_PROXY: "192.168.252.1"
      BULT_INGRESS_DIR: "/routes"
      BULT_JWT_SECRET: "67b36330715b07a791b806e0b6103264e5b96d65f33e7728d580f51336a4feb0"
    volumes:
      - ./app:/app/app
      - ./gen:/app/gen:ro
      - ./presets:/app/presets:ro
      - ingress-routes:/routes
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bult
      POSTGRES_PASSWORD: bult
      POSTGRES_DB: bult
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bult -d bult"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  ingress-routes:
