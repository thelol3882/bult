[project]
name = "control-plane"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Make the `app` package importable however pytest is started
# (`uv run pytest` from control-plane/, from the repo root, or from an IDE).
pythonpath = ["."]
testpaths = ["tests"]
