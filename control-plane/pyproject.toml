[project]
name = "control-plane"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "grpcio>=1.84.0",
    "protobuf>=6.33.3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Make the `app` package importable however pytest is started
# (`uv run pytest` from control-plane/, from the repo root, or from an IDE).
pythonpath = [".", "gen"]
markers = ["integration: needs PostgreSQL (docker compose up -d postgres)"]
addopts = "-m 'not integration'"  # integration: uv run pytest -q -m integration
testpaths = ["tests", "app"]  # domain tests live in app/<domain>/tests/

[tool.basedpyright]
extraPaths = ["gen"]
typeCheckingMode = "standard"
